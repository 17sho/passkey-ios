name: Build Unsigned iOS App (Passkey)

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web assets
        run: npx cap sync ios

      - name: Build unsigned .ipa (no codesign)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -allowProvisioningUpdates \
            build

      - name: Package .ipa (unsigned)
        run: |
          APP_PATH="ios/App/build/Build/Products/Release-iphoneos/App.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Passkey-unsigned.ipa Payload
          ls -la Passkey-unsigned.ipa

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Passkey-unsigned-ipa
          path: Passkey-unsigned.ipa
          if-no-files-found: error
